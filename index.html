<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حاسبة العمر</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:420px;
margin:auto;
background:rgba(0,0,0,0.5);
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

h1{
margin-bottom:20px;
}

input{
width:85%;
padding:12px;
margin:8px;
border:none;
border-radius:8px;
font-size:16px;
text-align:center;
}

button{

padding:12px 20px;
border:none;
border-radius:8px;
font-size:16px;
margin:10px;
cursor:pointer;
transition:0.3s;

}

.loginBtn{
background:#00c853;
color:white;
}

.calcBtn{
background:#2196f3;
color:white;
}

.copyBtn{
background:#ff9800;
color:white;
}

button:hover{
transform:scale(1.05);
}

#main{
display:none;
}

.result{
margin-top:20px;
line-height:1.9;
font-size:18px;
}

.dev{
margin-top:25px;
color:#ccc;
font-size:14px;
}

.error{
color:red;
}

</style>

</head>

<body>

<div class="container" id="login">

<h1>🔐 تسجيل الدخول</h1>

<input type="password" id="password" placeholder="ادخل الباسورد">

<br>

<button class="loginBtn" onclick="login()">دخول</button>

<p class="error" id="error"></p>

</div>



<div class="container" id="main">

<h1>🎂 حاسبة العمر</h1>

<input type="number" id="year" placeholder="مواليدك">

<input type="number" id="month" placeholder="الشهر">

<input type="number" id="day" placeholder="اليوم">

<br>

<button class="calcBtn" onclick="calculate()">حسناً</button>

<button class="copyBtn" onclick="copyAge()">نسخ العمر</button>

<div class="result" id="result"></div>

<div class="dev">
DEV: @ll00vvl
</div>

</div>



<script>

let resultText="";

function login(){

let pass=document.getElementById("password").value;

if(pass==="Hero"){

document.getElementById("login").style.display="none";
document.getElementById("main").style.display="block";

}else{

document.getElementById("error").innerText="❌ الباسورد خطأ";

}

}



function calculate(){

let y=document.getElementById("year").value;
let m=document.getElementById("month").value-1;
let d=document.getElementById("day").value;

let birth=new Date(y,m,d);

let now=new Date();

let diff=now-birth;

let seconds=Math.floor(diff/1000);
let minutes=Math.floor(seconds/60);
let hours=Math.floor(minutes/60);
let days=Math.floor(hours/24);
let months=Math.floor(days/30);
let years=Math.floor(days/365);

let dayName=["الاحد","الاثنين","الثلاثاء","الاربعاء","الخميس","الجمعة","السبت"];

let bornDay=dayName[birth.getDay()];

resultText=

"العمر: "+years+" سنة\n"+
"اليوم الي نولدت بي: "+bornDay+"\n"+
"الدقايق: "+minutes+"\n"+
"الثواني: "+seconds+"\n"+
"الساعات: "+hours+"\n"+
"الاشهر: "+months;

document.getElementById("result").innerHTML=

"العمر: "+years+" سنة"+"<br>"+
"اليوم الي نولدت بي: "+bornDay+"<br>"+
"الدقايق: "+minutes+"<br>"+
"الثواني: "+seconds+"<br>"+
"الساعات: "+hours+"<br>"+
"الاشهر: "+months;

}



function copyAge(){

navigator.clipboard.writeText(resultText);

alert("تم نسخ العمر 📋");

}

</script>

</body>
</html>
